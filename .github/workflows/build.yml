name: Build EXE and APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
      - run: flutter pub get
      - run: flutter test
      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -iE "error|what went wrong|failed|requires|exception" build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - run: cp build/app/outputs/flutter-apk/app-release.apk goldt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: goldt-android
          path: goldt.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath goldt-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: goldt-windows
          path: goldt-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          files: |
            goldt.apk
            goldt-windows.zip
